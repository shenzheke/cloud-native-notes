apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pod-status-alerts
  namespace: monitoring
spec:
  groups:
  - name: pod.rules
    rules:
    - alert: PodNotRunning
      expr: |
        kube_pod_status_phase{
          phase=~"Pending|Failed|Unknown"
        } > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Pod not running"
        description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is in {{ $labels.phase }} state"

#规则2：Pod CrashLoopBackOff（更关键）
    - alert: PodCrashLooping
      expr: |
        rate(kube_pod_container_status_restarts_total[5m]) > 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Pod restarting frequently"
        description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is restarting"
#规则3：Pod Pending（调度问题）
    - alert: PodPendingTooLong
      expr: |
        kube_pod_status_phase{phase="Pending"} > 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Pod pending too long"
        description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} pending >10m"
#规则4：Pod Failed（必须告警）
    - alert: PodFailed
      expr: |
        kube_pod_status_phase{phase="Failed"} > 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Pod failed"
        description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} failed"
