# n8n-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: n8n-svc
  namespace: n8n
spec:
  ports:
  - port: 5678
    targetPort: 5678
  selector:
    app: n8n
---
# n8n-ingress.yaml (以 Traefik 为例)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n-ingress
  namespace: n8n
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  rules:
  - host: n8n.zeroth.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: n8n-svc
            port:
              number: 5678
