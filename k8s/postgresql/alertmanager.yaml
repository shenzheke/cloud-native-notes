global:
  resolve_timeout: 5m
inhibit_rules:
- equal:
  - namespace
  - alertname
  source_matchers:
  - severity = critical
  target_matchers:
  - severity =~ warning|info
- equal:
  - namespace
  - alertname
  source_matchers:
  - severity = warning
  target_matchers:
  - severity = info
- equal:
  - namespace
  source_matchers:
  - alertname = InfoInhibitor
  target_matchers:
  - severity = info
- target_matchers:
  - alertname = InfoInhibitor
receivers:
- name: n8n-webhook
  webhook_configs:
  - send_resolved: true
    url: https://n8ntrace.ccwu.cc/webhook/k8s-alerts
route:
  group_by:
  - alertname
  - namespace
  - severity
  group_interval: 5m
  group_wait: 30s
  receiver: n8n-webhook
  repeat_interval: 12h
  routes:
  - matchers:
    - severity =~ "critical|warning"
    receiver: n8n-webhook
templates:
- /etc/alertmanager/config/*.tmpl