apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hello
  namespace: default
spec:
  template:
    spec:
      containers:
      - image: ghcr.io/knative/helloworld-go:latest
        ports:
        - containerPort: 8080
        env:
        - name: TARGET
          value: "World - Knative Serving Demo 3"

traffic:
  - latestRevision: true
    percent: 100
  - revisionName: hello-0001
    percent: 0

