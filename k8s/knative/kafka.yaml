apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: single-pool
  namespace: kafka
  labels:
    strimzi.io/cluster: my-cluster
spec:
  replicas: 1 #  修改为 1 个节点
  roles:
    - controller
    - broker
  storage:
    type: persistent-claim
    size: 20Gi
    class: ceph-rbd-sc # 依然使用你的 Ceph 存储
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: my-cluster
  namespace: kafka
spec:
  kafka:
    version: 4.1.2
    listeners:
      - name: plaintext
        port: 9092
        type: internal
        tls: false
      - name: tls        # 9093 加密端口（重新加回）
        port: 9093
        type: internal
        tls: true       # 开启 TLS
    config:
      # ⚠️ 注意：单节点必须把以下副本参数都改为 1，否则 Kafka 内部无法正常工作
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
  entityOperator:
    topicOperator: {}
    userOperator: {}
