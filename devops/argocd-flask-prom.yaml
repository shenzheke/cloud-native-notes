apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flask-prom-demo
  namespace: argocd
spec:
  project: default

  source:
    repoURL: http://10.0.0.200/gitops/flask-prom-demo
    targetRevision: main
    path: deploy/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

