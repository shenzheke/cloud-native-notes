apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apidemo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://10.0.0.200/apidemo/apidemo.git
    targetRevision: master
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: apidemo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

